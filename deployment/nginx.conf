# ================================================================
# DevWatch — nginx.conf
# Konfigurasi Reverse Proxy Nginx untuk Produksi (HTTPS + WebSocket)
# ================================================================

# Upstream Node.js DevWatch server
upstream devwatch_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name monitoring.kantor.com devwatch.local;

    # Redirect seluruh trafik ke HTTPS
    return 301 https://$host$request_uri;
}

# Blok HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitoring.kantor.com devwatch.local;

    # Sertifikat SSL/TLS
    # Opsi A: Let's Encrypt Certbot
    ssl_certificate /etc/letsencrypt/live/monitoring.kantor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitoring.kantor.com/privkey.pem;

    # Opsi B: Sertifikat Lokal Self-Signed DevWatch
    # ssl_certificate /path/to/devwatch/ssl/server.crt;
    # ssl_certificate_key /path/to/devwatch/ssl/server.key;

    # Parameter SSL Modern & Aman (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Ukuran upload maksimal (untuk upload logo dan backup)
    client_max_body_size 20M;

    # Rute WebSocket: /ws
    location /ws {
        proxy_pass http://devwatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Rute API & Frontend SPA
    location / {
        proxy_pass http://devwatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Buffer & Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Logging
    access_log /var/log/nginx/devwatch_access.log;
    error_log /var/log/nginx/devwatch_error.log warn;
}
